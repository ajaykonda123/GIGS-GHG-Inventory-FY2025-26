<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#ffffff"/>
  <rect x="0" y="0" width="1400" height="86" fill="#123a63"/>
  <text x="55" y="53" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">GIGS Manufacturing Pvt. Ltd. — GHG Inventory Dashboard FY 2025–26</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="55" y="115" rx="12" ry="12" width="285" height="110" fill="#eef5fb" stroke="#c9dbea"/>
    <text x="80" y="150" font-size="17" fill="#4a6075">Total GHG Emissions</text>
    <text x="80" y="195" font-size="34" font-weight="700" fill="#123a63">341.44 tCO₂e</text>

    <rect x="365" y="115" rx="12" ry="12" width="285" height="110" fill="#eef5fb" stroke="#c9dbea"/>
    <text x="390" y="150" font-size="17" fill="#4a6075">Scope 1</text>
    <text x="390" y="195" font-size="34" font-weight="700" fill="#123a63">90.70 tCO₂e</text>

    <rect x="675" y="115" rx="12" ry="12" width="285" height="110" fill="#eef5fb" stroke="#c9dbea"/>
    <text x="700" y="150" font-size="17" fill="#4a6075">Scope 2</text>
    <text x="700" y="195" font-size="34" font-weight="700" fill="#123a63">171.84 tCO₂e</text>

    <rect x="985" y="115" rx="12" ry="12" width="285" height="110" fill="#eef5fb" stroke="#c9dbea"/>
    <text x="1010" y="150" font-size="17" fill="#4a6075">Scope 3</text>
    <text x="1010" y="195" font-size="34" font-weight="700" fill="#123a63">78.90 tCO₂e</text>

    <text x="90" y="280" font-size="22" font-weight="700" fill="#203040">GHG emissions by scope</text>
    <circle cx="285" cy="430" r="100" fill="none" stroke="#e9eef3" stroke-width="42"/>
    <circle cx="285" cy="430" r="100" fill="none" stroke="#2f7fb8" stroke-width="42" pathLength="100" stroke-dasharray="26.56 73.44" stroke-dashoffset="0" transform="rotate(-90 285 430)"/>
    <circle cx="285" cy="430" r="100" fill="none" stroke="#f28e2b" stroke-width="42" pathLength="100" stroke-dasharray="50.33 49.67" stroke-dashoffset="-26.56" transform="rotate(-90 285 430)"/>
    <circle cx="285" cy="430" r="100" fill="none" stroke="#3a923a" stroke-width="42" pathLength="100" stroke-dasharray="23.11 76.89" stroke-dashoffset="-76.89" transform="rotate(-90 285 430)"/>
    <text x="285" y="423" text-anchor="middle" font-size="17" fill="#536474">Total</text>
    <text x="285" y="451" text-anchor="middle" font-size="24" font-weight="700" fill="#123a63">341.44</text>
    <rect x="120" y="565" width="14" height="14" fill="#2f7fb8"/><text x="142" y="578" font-size="16" fill="#394b59">Scope 1 — 26.56%</text>
    <rect x="120" y="595" width="14" height="14" fill="#f28e2b"/><text x="142" y="608" font-size="16" fill="#394b59">Scope 2 — 50.33%</text>
    <rect x="120" y="625" width="14" height="14" fill="#3a923a"/><text x="142" y="638" font-size="16" fill="#394b59">Scope 3 — 23.11%</text>

    <text x="520" y="280" font-size="22" font-weight="700" fill="#203040">GHG emissions by source (tCO₂e)</text>
