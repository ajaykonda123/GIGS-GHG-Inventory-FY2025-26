    <line x1="555" y1="330" x2="555" y2="610" stroke="#aeb9c3"/>
    <g stroke="#e6ebef">
      <line x1="555" y1="540" x2="1320" y2="540"/>
      <line x1="555" y1="470" x2="1320" y2="470"/>
      <line x1="555" y1="400" x2="1320" y2="400"/>
      <line x1="555" y1="330" x2="1320" y2="330"/>
