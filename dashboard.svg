    <g font-size="14" font-weight="700" fill="#34495a" text-anchor="middle">
      <text x="632" y="357">171.84</text><text x="732" y="514">60.00</text><text x="832" y="530">48.24</text>
      <text x="932" y="558">28.60</text><text x="1032" y="578">14.40</text><text x="1132" y="579">13.86</text><text x="1232" y="592">4.50</text>
    </g>
    <g font-size="13" fill="#4b5d6a" text-anchor="middle">
      <text x="632" y="632"><tspan x="632">Grid</tspan><tspan x="632" dy="16">electricity</tspan></text>
      <text x="732" y="632"><tspan x="732">Purchased raw</tspan><tspan x="732" dy="16">materials</tspan></text>
      <text x="832" y="632">Diesel</text>
      <text x="932" y="632"><tspan x="932">Refrigerant</tspan><tspan x="932" dy="16">leakage</tspan></text>
      <text x="1032" y="632"><tspan x="1032">Employee</tspan><tspan x="1032" dy="16">commuting</tspan></text>
      <text x="1132" y="632">Petrol</text>
      <text x="1232" y="632"><tspan x="1232">Waste</tspan><tspan x="1232" dy="16">treatment</tspan></text>
    </g>

    <rect x="55" y="700" rx="12" ry="12" width="1290" height="72" fill="#f6f9fb" stroke="#d9e2e8"/>
    <text x="80" y="730" font-size="18" font-weight="700" fill="#123a63">Key finding:</text>
    <text x="190" y="730" font-size="18" fill="#2f4050">Grid electricity is the largest hotspot, contributing 171.84 tCO₂e (50.33%) of total modelled emissions.</text>
    <text x="80" y="758" font-size="14" fill="#687986">Training-based portfolio case study. Activity data and exercise emission factors were supplied through a MAESA Foundation training exercise.</text>
